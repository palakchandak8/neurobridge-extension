<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>NeuroBridge</h1>
    </div>
    <label class="switch" title="Turn reading mode on or off">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
      <span class="sr">Reading mode</span>
    </label>
  </header>

  <aside id="cta" hidden>
    <p class="cta-title">Get settings that fit you</p>
    <p class="cta-text">Take the NeuroBridge reading assessment and we'll suggest a setup for you. Takes a few minutes.</p>
    <div class="cta-actions">
      <a id="take-test" href="#" target="_blank" rel="noopener">Take the assessment</a>
      <button type="button" id="dismiss-cta" class="ghost">Not now</button>
    </div>
  </aside>
  <aside id="profile-ok" hidden>Your NeuroBridge profile settings are applied.</aside>

  <main id="controls">
    <section>
      <label for="font">Font</label>
      <select id="font">
        <option value="default">Page default</option>
        <option value="opendyslexic">OpenDyslexic</option>
        <option value="atkinson">Atkinson Hyperlegible</option>
        <option value="arial">Arial</option>
        <option value="verdana">Verdana</option>
        <option value="tahoma">Tahoma</option>
      </select>
      <p id="preview">The quick brown fox jumps over the lazy dog.</p>
    </section>

    <section class="slider">
      <label for="fontSize">Text size <output id="fontSize-out"></output></label>
      <input type="range" id="fontSize" min="80" max="200" step="5">
    </section>
    <section class="slider">
      <label for="letterSpacing">Letter spacing <output id="letterSpacing-out"></output></label>
      <input type="range" id="letterSpacing" min="0" max="5" step="0.1">
    </section>
    <section class="slider">
      <label for="wordSpacing">Word spacing <output id="wordSpacing-out"></output></label>
      <input type="range" id="wordSpacing" min="0" max="10" step="0.5">
    </section>
    <section class="slider">
      <label for="lineHeight">Line spacing <output id="lineHeight-out"></output></label>
      <input type="range" id="lineHeight" min="1" max="2.5" step="0.1">
    </section>
    <section class="slider">
      <label for="paragraphSpacing">Paragraph spacing <output id="paragraphSpacing-out"></output></label>
      <input type="range" id="paragraphSpacing" min="0" max="40" step="2">
    </section>
    <section class="slider">
      <label for="fontWeight">Text weight <output id="fontWeight-out"></output></label>
      <input type="range" id="fontWeight" min="400" max="800" step="100">
    </section>

    <section>
      <span class="label">Background</span>
      <div class="swatches" id="background" role="radiogroup" aria-label="Background">
        <button type="button" data-v="default" class="sw sw-default" title="Page default" aria-label="Page default"></button>
        <button type="button" data-v="white" class="sw sw-white" title="White" aria-label="White"></button>
        <button type="button" data-v="cream" class="sw sw-cream" title="Cream" aria-label="Cream"></button>
        <button type="button" data-v="blue" class="sw sw-blue" title="Light blue" aria-label="Light blue"></button>
        <button type="button" data-v="dark" class="sw sw-dark" title="Dark" aria-label="Dark"></button>
      </div>
    </section>
  </main>

  <footer>
    <button type="button" id="reset" class="ghost">Reset settings</button>
    <a id="open-site" href="#" target="_blank" rel="noopener">Open NeuroBridge</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
